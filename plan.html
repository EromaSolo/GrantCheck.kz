<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrantCheck.kz — План подачи документов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <header class="bg-indigo-800 text-white py-5 px-4">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <a href="index.html" class="text-2xl font-extrabold">GrantCheck<span class="text-indigo-300">.kz</span></a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
    <h1 class="text-3xl font-extrabold mb-2">Календарь абитуриента ЕНТ</h1>
    <p class="text-slate-600 mb-6">Чек-лист основных этапов поступления в вузы Казахстана.</p>

    <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8">
      <ul id="steps-list" class="space-y-4"></ul>
    </div>

    <a href="index.html" class="block text-center btn-primary mt-6 text-xl font-bold rounded-xl py-4">
      Вернуться на главную
    </a>
  </main>

  <script type="module">
    import { fetchSteps } from './js/api.js';
    import './js/app.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const steps = await fetchSteps();
      const list = document.getElementById('steps-list');

      steps.forEach(([date, text], idx) => {
        list.innerHTML += `
          <li class="flex items-start gap-3">
            <input type="checkbox" id="step-${idx}" class="mt-1 w-5 h-5 accent-indigo-700 cursor-pointer">
            <label for="step-${idx}" class="cursor-pointer">
              <span class="block font-bold text-lg">${text}</span>
              <span class="text-sm text-slate-500">${date}</span>
            </label>
          </li>
        `;
      });
    });
  </script>
</body>
</html>
