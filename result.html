<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrantCheck.kz — Результаты расчета</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <header class="bg-indigo-800 text-white py-5 px-4">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <a href="index.html" class="text-2xl font-extrabold">GrantCheck<span class="text-indigo-300">.kz</span></a>
      <a href="shortlist.html" class="text-sm font-bold bg-white text-indigo-800 rounded-lg px-3 py-2">Избранное (<span id="shortlist-count">0</span>)</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
    <a href="index.html" class="text-indigo-800 font-bold underline">← Изменить балл / Назад</a>

    <div id="result-card" class="rounded-2xl border-2 p-6 sm:p-8"></div>

    <!-- История проходных баллов -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8">
      <h2 class="text-2xl font-extrabold">Динамика проходных баллов</h2>
      <p class="text-slate-600 text-sm mt-1">Минимальный балл ЕНТ, получивший грант по годам</p>
      <div id="cutoffs-grid" class="mt-5 grid grid-cols-4 gap-3 text-center"></div>
    </div>

    <!-- Безопасные альтернативы с той же комбинацией предметов -->
    <div>
      <h2 class="text-2xl font-extrabold">Более безопасные альтернативы</h2>
      <p class="text-slate-600 text-sm mt-1">Специальности с этими же профильными предметами и высоким шансом гранта</p>
      <div id="alternatives-grid" class="mt-4 grid gap-4 sm:grid-cols-2"></div>
    </div>
  </main>

  <script type="module">
    import { fetchMajors } from './js/api.js';
    import { calculateProbability, getRiskAssessment } from './js/calculator.js';
    import { getShortlistFromStorage, saveShortlistToStorage } from './js/api.js';
    import './js/app.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const rawQuery = sessionStorage.getItem('grantcheck_query');
      if (!rawQuery) {
        window.location.href = 'index.html';
        return;
      }

      const query = JSON.parse(rawQuery);
      const majors = await fetchMajors();
      const currentMajor = majors[query.majorKey];

      if (!currentMajor) return;

      const prob = calculateProbability(query.score, currentMajor);
      const risk = getRiskAssessment(prob);
      const lastCutoff = currentMajor.cutoffs[3];
      const gap = lastCutoff - query.score;

      // Рендер основной карточки
      const card = document.getElementById('result-card');
      card.className = `rounded-2xl border-2 p-6 sm:p-8 ${risk.cardBg}`;
      card.innerHTML = `
        <p class="text-lg font-bold">${currentMajor.name} · ${query.score} баллов ЕНТ</p>
        <div class="mt-3 flex items-center gap-4">
          <span class="text-6xl font-extrabold">${prob}%</span>
          <span class="rounded-full px-4 py-2 text-lg font-bold ${risk.badgeBg}">${risk.level}</span>
        </div>
        <p class="mt-4 text-lg">
          ${gap > 0 ? `Вам не хватает <b>${gap} баллов</b> до порога прошлого года (${lastCutoff}).` : `Вы превышаете прошлогодний порог (${lastCutoff}) на <b>${-gap} баллов</b>.`}
        </p>
        <button id="add-btn" class="mt-5 btn-primary font-bold text-lg px-6 py-3 rounded-xl">
          Добавить специальность в Избранное
        </button>
      `;

      document.getElementById('add-btn').addEventListener('click', () => {
        const list = getShortlistFromStorage();
        if (!list.includes(query.majorKey)) {
          list.push(query.majorKey);
          saveShortlistToStorage(list);
          window.location.href = 'shortlist.html';
        } else {
          alert('Эта специальность уже в вашем списке!');
        }
      });

      // Рендер истории проходных баллов
      const cutoffsGrid = document.getElementById('cutoffs-grid');
      currentMajor.cutoffs.forEach((c, idx) => {
        cutoffsGrid.innerHTML += `
          <div class="rounded-xl border border-slate-200 p-3 ${idx === 3 ? 'bg-indigo-50 border-indigo-600' : ''}">
            <div class="text-2xl font-extrabold">${c}</div>
            <div class="text-xs text-slate-500">${2022 + idx} г.</div>
          </div>
        `;
      });

      // Рендер альтернатив
      const altGrid = document.getElementById('alternatives-grid');
      const alternatives = Object.values(majors).filter(m =>
        m.id !== currentMajor.id &&
        m.subs[0] === currentMajor.subs[0] &&
        m.subs[1] === currentMajor.subs[1]
      );

      if (alternatives.length === 0) {
        altGrid.innerHTML = `<p class="text-slate-500">Других специальностей с такой комбинацией предметов пока нет.</p>`;
      } else {
        alternatives.forEach(alt => {
          const altProb = calculateProbability(query.score, alt);
          const altRisk = getRiskAssessment(altProb);
          altGrid.innerHTML += `
            <div class="bg-white rounded-xl border border-slate-200 p-5 flex flex-col justify-between">
              <div>
                <h3 class="font-extrabold text-lg">${alt.name}</h3>
                <p class="text-sm text-slate-500">${alt.uni}</p>
                <div class="mt-3 flex items-center gap-2">
                  <span class="text-2xl font-extrabold">${altProb}%</span>
                  <span class="text-xs font-bold px-2 py-1 rounded-full ${altRisk.badgeBg}">${altRisk.level}</span>
                </div>
              </div>
              <p class="text-xs text-slate-500 mt-4">Прошлогодний грантовый балл: <b>${alt.cutoffs[3]}</b></p>
            </div>
          `;
        });
      }
    });
  </script>
</body>
</html>
